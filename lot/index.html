<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOT 관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with four tabs (LOT 현황 · 입고/출고 · 작업오더 · 기준정보); one panel at a time. Same palette as the original dashboard. */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --line: #d5dbd8; --fg: #17211e; --muted: #5f6d68;
  --accent: #0f6e5c; --accent-soft: #dcefe9; --slot: #f8faf9;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --warn: #b26a00; --warn-bg: rgba(178, 106, 0, 0.08); --bad: #c62828; --bad-bg: rgba(198, 40, 40, 0.07);
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101514; --surface: #171e1c; --line: #2b3633; --fg: #e6ecea; --muted: #94a39e;
    --accent: #4fc2a8; --accent-soft: #1a332d; --slot: #131a18; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --warn: #e0a040; --warn-bg: rgba(224, 160, 64, 0.1); --bad: #ef6b6b; --bad-bg: rgba(239, 107, 107, 0.1); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101514; --surface: #171e1c; --line: #2b3633; --fg: #e6ecea; --muted: #94a39e;
  --accent: #4fc2a8; --accent-soft: #1a332d; --slot: #131a18; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --warn: #e0a040; --warn-bg: rgba(224, 160, 64, 0.1); --bad: #ef6b6b; --bad-bg: rgba(239, 107, 107, 0.1); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-block: 16px 6px; }
.brand h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.brand-side { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.stamp { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.sync-state::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.sync-state[data-s="ok"]::before { background: var(--s3); }
.sync-state[data-s="err"]::before { background: var(--s2); }
.sync-btn { font: inherit; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 1px solid transparent; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.sync-btn:hover { border-color: var(--accent); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; border: 0; background: none; font: inherit; font-weight: 500; color: var(--muted); padding: 9px 12px 11px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
main { padding-block: 24px 56px; display: flex; flex-direction: column; gap: 20px; }
.status { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-height: 18px; }
#view { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.panel-top h3 { margin: 0; font-size: 16px; font-weight: 700; }
.sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.btn { appearance: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); color: var(--surface); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:focus-visible, .linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.linkbtn { appearance: none; border: 0; background: none; font: inherit; color: var(--accent); font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0 2px; }
.search { font: inherit; font-size: 13px; color: var(--fg); background: var(--slot); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; width: 240px; max-width: 100%; }
.search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.scroll { overflow: auto; max-height: 62vh; border: 1px solid var(--line); border-radius: 6px; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
table.t th { position: sticky; top: 0; z-index: 1; background: var(--accent-soft); color: var(--fg); font-weight: 600; text-align: right; padding: 7px 10px; border-bottom: 2px solid var(--accent); white-space: nowrap; }
table.t td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.t th.l, table.t td.l { text-align: left; }
table.t td.mono { font-family: var(--font-mono); font-size: 12px; }
table.t td.z { color: var(--muted); }
table.t td.neg { color: var(--bad); font-weight: 700; }
table.t td.b { font-weight: 700; }
table.t tr.grp td { background: var(--slot); font-weight: 600; cursor: pointer; }
table.t tr.grp:hover td { background: var(--accent-soft); }
table.t tr.lot td { font-size: 12px; }
table.t tr.lot td.first { padding-left: 28px; }
table.t tbody tr:last-child td { border-bottom: 0; }
.caret { display: inline-block; width: 14px; color: var(--muted); font-size: 11px; transition: transform 0.15s; }
tr.open .caret { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }

.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--slot); color: var(--muted); white-space: nowrap; }
.tag.ok { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tag.next { color: var(--surface); border-color: var(--accent); background: var(--accent); }
.tag.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.tag.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.issues { margin: 0; padding: 10px 14px 10px 30px; border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 6px; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }

.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item { appearance: none; font: inherit; text-align: left; color: var(--fg); background: var(--slot); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item:hover { border-color: var(--accent); }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.item[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.item .nm { font-size: 13px; font-weight: 600; color: var(--muted); overflow-wrap: anywhere; }
.item b { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.item .meta { font-size: 12px; color: var(--muted); }
.item.zero b { color: var(--muted); opacity: 0.6; }
.item .old { color: var(--warn); font-weight: 600; }

.paste-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.paste-grid > * { min-width: 0; }
.cols { font-family: var(--font-mono); font-size: 11px; color: var(--muted); line-height: 1.7; }
.cols b { color: var(--fg); font-weight: 500; }
textarea.paste { white-space: pre; overflow: auto; font-family: var(--font-mono); font-size: 12px; color: var(--fg); background: var(--slot); border: 1.5px dashed var(--line); border-radius: 6px; padding: 10px; width: 100%; min-height: 110px; resize: vertical; }
textarea.paste:focus { outline: none; border-color: var(--accent); border-style: solid; }
.prev-sum { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
tr.err td { background: var(--bad-bg); }
tr.upd td { background: var(--warn-bg); }
tr.dup td { color: var(--muted); }
.del { appearance: none; font: inherit; font-size: 12px; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 4px; cursor: pointer; padding: 2px 8px; }
.del:hover { color: var(--bad); border-color: var(--bad); }
.del:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select.sel { font: inherit; font-size: 13px; color: var(--fg); background: var(--slot); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }

.plan { margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.plan li::marker { color: var(--accent); font-weight: 700; }

/* 기준정보 */
.ms-grid { display: grid; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr); gap: 18px; align-items: start; }
.ms-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.ms-li { appearance: none; font: inherit; text-align: left; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.ms-li:last-child { border-bottom: 0; }
.ms-li:hover { background: var(--slot); }
.ms-li:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ms-li[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.ms-li .nm { font-size: 14px; font-weight: 600; }
.ms-li .bx { font-size: 12px; color: var(--muted); white-space: nowrap; }
.ms-li .bx.no { color: var(--warn); }
.ms-detail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ms-detail h4 { margin: 0; font-size: 18px; font-weight: 700; }
.ms-box { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.ms-box span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg); }
.num { font: inherit; font-size: 15px; width: 110px; text-align: right; color: var(--fg); background: var(--slot); border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px; font-variant-numeric: tabular-nums; }
.num:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.plist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; max-width: 520px; }
.ph { font-size: 12px; font-weight: 600; background: var(--accent-soft); padding: 7px 12px; border-bottom: 2px solid var(--accent); }
.prow { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); margin: 0; }
.prow:last-child { border-bottom: 0; }
.pin { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 13px; color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 4px 6px; }
.pin:hover { border-color: var(--line); }
.pin:focus { background: var(--slot); border-color: var(--accent); outline: none; }
.addrow { background: var(--slot); }
.addrow .pin { border-color: var(--line); background: var(--surface); }
.lines { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: start; }
.lg { display: flex; flex-direction: column; gap: 5px; border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; background: var(--slot); min-width: 0; }
.lg b { font-size: 13px; }
.lg input, .lg select { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; width: 100%; min-width: 0; }
.lg input { font-weight: 600; }
.upd-note { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg); font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 999px; }

@media (max-width: 900px) { .paste-grid { grid-template-columns: 1fr; } .lines { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .ms-grid { grid-template-columns: 1fr; } }
@media (max-width: 480px) { .lines { grid-template-columns: 1fr; } .search { width: 100%; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>LOT 관리</h1>
      <div class="brand-side">
        <span class="sync"><span class="sync-state" id="sync-state" role="status">내 브라우저에만 저장 중</span><button class="sync-btn" id="sync-btn" type="button">로그인</button></span>
        <span class="stamp" id="stamp"></span>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="화면">
      <button class="tab" role="tab" type="button" data-view="lots">LOT 현황</button>
      <button class="tab" role="tab" type="button" data-view="io">입고 · 출고</button>
      <button class="tab" role="tab" type="button" data-view="wo">작업오더</button>
      <button class="tab" role="tab" type="button" data-view="master">기준정보</button>
    </nav>
  </div>
</header>
<div class="wrap">
<main>
  <div class="status" id="status" role="status"></div>
  <div id="view"></div>
</main>
</div>
<script>
// ── LOT 관리 ──
// 원본 대시보드와 따로 움직이는 새 대시보드입니다. 저장 이름은 모두 "lot-"으로 시작해 원본(pl-…) 데이터와 섞이지 않습니다.
// 입력은 엑셀에서 셀을 복사해 붙여넣는 방식만 씁니다(파일 올리기 없음). 붙여넣은 줄은 기존 내용에 계속 더해지고, 같은 줄이 다시 오면 고칩니다.
// 처음 열 때 한 번만 원본의 기준정보 · 라인 구성을 가져오고, 재고는 0에서 시작합니다.
var OLD_DAYS = 30;                  // 입고 후 이만큼 지난 LOT는 "오래됨"
var SKIP_MODELS = ["CL4"];          // 쓰지 않는 차종
var K_MASTER = "lot-master", K_LINES = "lot-lines", K_IO_PREFIX = "lot-io-", K_IO_RE = /^lot-io-\d{4}-\d{2}$/;
var LINE_GROUPS = [{ id: "A", label: "A라인", n: 1 }, { id: "BC", label: "B·C라인", n: 1 }, { id: "DE", label: "D·E라인", n: 4 }, { id: "F", label: "F라인", n: 8 }];
// 원본에서 가져올 게 없을 때 쓰는 AC28 기본 품목 · 품번 (2026년 11월 영업창고 엑셀 집계 시트 기준)
var DEFAULT_PARTS = [
  ["FRONT", ["91200-FC010", "91200-FC020", "91200-FC030", "91200-FC040"]], ["CONT", ["91400-FC010"]], ["FLOOR_CORD", ["91500-FCSUB"]],
  ["ROOF", ["91800-FC930", "91801-FC060", "91801-FC380", "91802-FC110"]], ["T/GATE", ["91650-FC010", "91650-FC070", "91650-FC080"]],
  ["FPAS", ["91890-FC010", "91890-FC090", "91890-FC200"]], ["RPAS", ["91880-FC010", "91880-FC030", "91880-FC050", "91880-FC100"]],
  ["BATT(+)", ["91850-FC010"]], ["ENG_GND", ["91861-FC010"]], ["FEM", ["91840-FC020", "91840-FC030"]], ["HSG", ["91674-FC010"]],
  ["INVERTER DC", ["91671-FC010"]], ["MOTOR AC", ["91673-FC010"]], ["OPU AC", ["91663-FC010"]]
];

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function key(p) { return String(p || "").trim().toUpperCase(); }
function fmt(n) { return (Math.round(n * 1000) / 1000).toLocaleString("en-US"); }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function today() { return ymd(new Date()); }
function daysSince(d) { if (!d) return null; var a = new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)), b = new Date(); b.setHours(0, 0, 0, 0); return Math.round((b - a) / 86400000); }
function getJSON(k, dflt) { try { var v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? dflt : v; } catch (e) { return dflt; } }
function setJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { say("브라우저에 저장하지 못했습니다(저장 공간 부족?)"); return false; } }
function say(t) { document.getElementById("status").textContent = t || ""; }
function skipModel(m) { return SKIP_MODELS.indexOf(String(m || "").trim().toUpperCase()) >= 0; }

// ── 처음 한 번: 원본에서 기준정보 · 라인 구성 가져오기 (같은 주소라 같은 브라우저 저장소를 읽을 수 있음). 재고는 가져오지 않습니다. ──
(function firstImport() {
  if (localStorage.getItem(K_MASTER) === null) {
    var src = getJSON("pl-master1", null), parts = [], box = {}, from = "기본 AC28 목록";
    if (src && src.parts && src.parts.length) {
      src.parts.forEach(function (x) { if (!skipModel(x.m)) parts.push({ m: x.m, n: x.n, p: x.p }); });
      Object.keys(src.box || {}).forEach(function (k) { if (!skipModel(k.split("|")[0])) box[k] = src.box[k]; });
      from = "원본 대시보드 기준정보";
    }
    if (!parts.length) DEFAULT_PARTS.forEach(function (it) { it[1].forEach(function (p) { parts.push({ m: "AC28", n: it[0], p: p }); }); });
    setJSON(K_MASTER, { parts: parts, box: box, from: from, at: Date.now() });
  }
  if (localStorage.getItem(K_LINES) === null) {
    var w = getJSON("pl-wh1", null), G = {};
    LINE_GROUPS.forEach(function (g) {
      var og = w && w.groups && w.groups[g.id], name = og ? og.name : "";
      if (!name && w && w.lines) g.id.split("").forEach(function (l) { if (!name && w.lines[l]) name = String(w.lines[l]); });
      var items = (og && og.items || []).filter(function (k) { return k && !skipModel(k.split("|")[0]); });
      G[g.id] = { name: name || "", items: items };
    });
    setJSON(K_LINES, G);
  }
})();

// ── 상태 ──
var M, LINES, IO = {}, idx = {};
function loadAll() {
  M = getJSON(K_MASTER, { parts: [], box: {} }); if (!M.box) M.box = {}; if (!M.parts) M.parts = [];
  M.parts = M.parts.filter(function (x) { return !skipModel(x.m); });
  idx = {}; M.parts.forEach(function (x, i) { idx[key(x.p)] = x; x.i = i; });
  LINES = getJSON(K_LINES, {}); LINE_GROUPS.forEach(function (g) { if (!LINES[g.id]) LINES[g.id] = { name: "", items: [] }; });
  IO = {};
  for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (K_IO_RE.test(k)) IO[k.slice(K_IO_PREFIX.length)] = getJSON(k, []); }
}
function saveMaster() { var c = { parts: M.parts.map(function (x) { return { m: x.m, n: x.n, p: x.p }; }), box: M.box, from: M.from, at: M.at }; setJSON(K_MASTER, c); loadAll(); }
function saveMonth(mon) { if (IO[mon] && IO[mon].length) setJSON(K_IO_PREFIX + mon, IO[mon]); else { try { localStorage.removeItem(K_IO_PREFIX + mon); } catch (e) {} delete IO[mon]; } }
function part(p) { return idx[key(p)] || null; }
function itemKey(m, n) { return m + "|" + n; }

    '<input class="search" id="io-q" type="search" placeholder="품번 · LOT 찾기" aria-label="품번 · LOT 찾기" value="' + esc(ioQ) + '"></div></div>' +
    (rows.length ? '<div class="scroll"><table class="t"><thead><tr><th class="l">일자</th><th class="l">구분</th><th>순번</th><th class="l">품목</th><th class="l">품번</th><th class="l">LOT</th><th>수량</th><th class="l">입고처 · 출고처</th><th class="l">비고</th><th></th></tr></thead><tbody>' +
      rows.slice(0, 500).map(function (r) { var x = part(r.p); return '<tr><td class="l mono">' + esc(r.d) + '</td><td class="l">' + (r.k === "in" ? "입고" : "출고") + "</td><td>" + esc(r.no) + '</td><td class="l">' + esc(x ? x.n : "") + '</td><td class="l mono">' + esc(r.p) + '</td><td class="l mono">' + esc(r.lot) + '</td><td class="' + (r.q < 0 ? "neg" : "") + '">' + fmt(r.q) + '</td><td class="l">' + esc(r.w) + '</td><td class="l">' + esc(r.note) + '</td><td><button class="del" type="button" data-del="' + esc(r.id) + '">지우기</button></td></tr>'; }).join("") +
      "</tbody></table></div>" + (rows.length > 500 ? '<p class="hint">최근 500줄만 보여 줍니다. 월을 고르면 더 볼 수 있어요.</p>' : "")
      : '<p class="hint">기록이 없습니다.</p>') + "</section>";
  var foc = document.activeElement && document.activeElement.id === "io-q";
  el.innerHTML = h;
  if (foc) document.getElementById("io-q").focus();
}

// ── 작업오더 (자리만) ──
function renderWO(el) {
  el.innerHTML = '<section class="panel"><div class="panel-top"><div><h3>작업오더</h3><span class="sub">작업오더 샘플을 받으면 열 순서를 정해 붙여넣기를 엽니다</span></div><span class="tag">준비 중</span></div>' +
    '<ol class="plan"><li>작업오더 줄을 엑셀에서 복사해 붙여넣으면 기존 오더에 계속 더해지고, 같은 오더는 내용만 고칩니다.</li>' +
    "<li>오더에서 나온 LOT가 입고 · 출고 탭의 영업창고 입고에 나타나면 저절로 \"영업창고\"로 넘어갑니다. 그 사이는 \"공정 중\"과 경과일로 보여 줍니다.</li>" +
    "<li>리워크 오더는 원래 LOT를 \"리워크로 넘어감\"으로 닫고 새 LOT와 잇습니다. 품번 · 개정이 바뀌어도 따라갑니다.</li>" +
    "<li>가장 먼저 잡아낼 것: 오더는 나왔는데 오래 창고에 들어오지 않은 LOT.</li></ol>" +
    '<p class="hint">샘플은 붙여넣을 범위를 그대로 복사해 Claude 대화에 붙여 주세요. 몇 줄이면 충분하고, 리워크 오더도 한두 줄 있으면 좋습니다.</p></section>';
}

// ── 기준정보 ──
var msItem = "", msBusy = false, msMsg = "", msTimer = null;
function renderMaster(el) {
  var its = items(); if (!its.some(function (I) { return itemKey(I.m, I.n) === msItem; })) msItem = its.length ? itemKey(its[0].m, its[0].n) : "";
  var cur = its.filter(function (I) { return itemKey(I.m, I.n) === msItem; })[0];
  var noBox = its.filter(function (I) { return !M.box[itemKey(I.m, I.n)]; }).length;
  var h = '<section class="panel"><div class="panel-top"><div><h3>품목 · 품번</h3><span class="sub">품목을 고르고 상자당 적재 수량과 품번을 관리합니다 · 품목 ' + its.length + "개 · 품번 " + M.parts.length + "개" + (noBox ? " · 상자당 수량 미입력 " + noBox + "개" : "") + (M.from ? " · 처음 가져온 곳: " + esc(M.from) : "") + "</span></div></div>" +
    '<div class="ms-grid"><div class="ms-list" role="listbox" aria-label="품목">' + its.map(function (I) { var k = itemKey(I.m, I.n), b = M.box[k]; return '<button class="ms-li" type="button" role="option" data-msi="' + esc(k) + '" aria-selected="' + (k === msItem) + '"><span class="nm">' + esc(I.n) + '</span><span class="bx' + (b ? "" : " no") + '">' + (b ? "상자당 " + b + "개" : "수량 미입력") + "</span></button>"; }).join("") + "</div>";
  if (cur) h += '<div class="ms-detail"><h4>' + esc(cur.n) + ' <span class="sub" style="display:inline">' + esc(cur.m) + " · 품번 " + cur.parts.length + "개</span></h4>" +
    '<label class="ms-box">상자당 적재 수량<span><input class="num" type="number" min="1" step="1" inputmode="numeric" id="ms-box" value="' + (M.box[msItem] || "") + '" placeholder="입력"> 개</span></label>' +
    '<div class="plist"><div class="ph">품번</div>' + cur.parts.map(function (x) { return '<div class="prow"><input class="pin" data-msp="' + esc(x.p) + '" value="' + esc(x.p) + '" aria-label="품번 ' + esc(x.p) + ' 수정"><button class="del" type="button" data-msdel="' + esc(x.p) + '">삭제</button></div>'; }).join("") +
    '<form class="prow addrow" id="ms-add"><input class="pin" id="ms-add-p" placeholder="새 품번" aria-label="품번 추가" required><button class="btn primary" type="submit">추가</button></form></div>' +
    '<p class="hint">품번 칸을 고치고 다른 곳을 누르면 저장됩니다.</p></div>';
  h += "</div></section>";
  h += '<section class="panel"><div class="panel-top"><div><h3>라인 구성</h3><span class="sub">원본 대시보드에서 가져온 라인 이름 · 품목입니다. 배치도는 나중에 이 구성으로 붙입니다.</span></div></div><div class="lines">' +
    LINE_GROUPS.map(function (g) {
      var cfg = LINES[g.id], s = '<div class="lg"><b>' + g.label + '</b><input type="text" data-lname="' + g.id + '" value="' + esc(cfg.name) + '" placeholder="라인 이름" aria-label="' + g.label + ' 이름">';
      for (var i = 0; i < g.n; i++) { var v = (cfg.items || [])[i] || ""; s += '<select data-litem="' + g.id + '" data-idx="' + i + '" aria-label="' + g.label + " 품목 " + (i + 1) + '"><option value="">– 품목 선택 –</option>' + its.map(function (I) { var k = itemKey(I.m, I.n); return '<option value="' + esc(k) + '"' + (k === v ? " selected" : "") + ">" + esc(I.n) + "</option>"; }).join("") + "</select>"; }
      return s + "</div>";
    }).join("") + "</div></section>";
  msBusy = true; try { el.innerHTML = h; } finally { msBusy = false; }
}
function msLater(m) { if (m) msMsg = m; clearTimeout(msTimer); msTimer = setTimeout(function () { render(); if (msMsg) say(msMsg); msMsg = ""; }, 0); }

// ── 이벤트 ──
var viewEl = document.getElementById("view");
viewEl.addEventListener("click", function (e) {
  var t = e.target.closest && e.target.closest("[data-item],[data-item-clear],[data-part],[data-go],[data-apply],[data-clear],[data-del],[data-msi],[data-msdel]");
  if (!t) return;
  if (t.hasAttribute("data-go")) { view = t.getAttribute("data-go"); render(); return; }
  if (t.hasAttribute("data-item")) { var k = t.getAttribute("data-item"); lotItem = lotItem === k ? null : k; render(); return; }
  if (t.hasAttribute("data-item-clear")) { lotItem = null; render(); return; }
  if (t.hasAttribute("data-part")) { var pk = key(t.getAttribute("data-part")); if (collapsed[pk]) delete collapsed[pk]; else collapsed[pk] = 1; render(); return; }
  if (t.hasAttribute("data-apply")) {
    var kind = t.getAttribute("data-apply"), n = applyPaste(pending[kind] || []);
    pending[kind] = null; pasteText[kind] = ""; render();
    say((kind === "in" ? "입고 " : "출고 ") + (n.new ? n.new + "줄 추가" : "") + (n.new && n.upd ? " · " : "") + (n.upd ? n.upd + "줄 고침" : "") + " · LOT 현황에 반영했습니다");
    return;
  }
  if (t.hasAttribute("data-clear")) { var ck = t.getAttribute("data-clear"); pending[ck] = null; pasteText[ck] = ""; render(); return; }
  if (t.hasAttribute("data-del")) {
    var id = t.getAttribute("data-del"), found = null;
    Object.keys(IO).forEach(function (m) { IO[m].forEach(function (r) { if (r.id === id) found = { m: m, r: r }; }); });
    if (!found || !confirm(found.r.d + " · " + found.r.p + " · LOT " + found.r.lot + " · " + fmt(found.r.q) + " 줄을 지울까요?")) return;
    IO[found.m] = IO[found.m].filter(function (r) { return r.id !== id; }); saveMonth(found.m); loadAll(); render(); say("한 줄을 지웠습니다");
    return;
  }
  if (t.hasAttribute("data-msi")) { msItem = t.getAttribute("data-msi"); render(); return; }
  if (t.hasAttribute("data-msdel")) {
    var p = t.getAttribute("data-msdel");
    if (!confirm(p + " 품번을 기준정보에서 삭제할까요?")) return;
    M.parts = M.parts.filter(function (x) { return key(x.p) !== key(p); }); saveMaster(); msLater(p + " 품번을 삭제했습니다");
  }
});
viewEl.addEventListener("input", function (e) {
  var t = e.target;
  if (t.id === "paste-in" || t.id === "paste-out") {
    var kind = t.id.slice(6); pasteText[kind] = t.value; pending[kind] = t.value.trim() ? parsePaste(kind, t.value) : null;
    document.getElementById("prev-" + kind).innerHTML = previewHTML(kind);
    return;
  }
  if (t.id === "lot-q") { lotQ = t.value; clearTimeout(viewEl._q); viewEl._q = setTimeout(render, 150); return; }
  if (t.id === "io-q") { ioQ = t.value; clearTimeout(viewEl._q); viewEl._q = setTimeout(render, 150); }
});
viewEl.addEventListener("change", function (e) {
  var t = e.target;
  if (msBusy || !t.isConnected) return;
  if (t.id === "show-closed") { showClosed = t.checked; render(); return; }
  if (t.id === "io-mon") { ioMon = t.value; render(); return; }
  if (t.id === "io-kind") { ioKind = t.value; render(); return; }
  if (t.id === "ms-box") {
    var n = Math.floor(Number(t.value)); if ((M.box[msItem] || 0) === (n > 0 ? n : 0)) return;
    if (n > 0) M.box[msItem] = n; else delete M.box[msItem];
    saveMaster(); msLater(msItem.split("|")[1] + (n > 0 ? " 상자당 " + n + "개로 저장했습니다" : " 상자당 수량을 지웠습니다"));
    return;
  }
  if (t.hasAttribute("data-msp")) {
    var old = t.getAttribute("data-msp"), v = t.value.trim(), x = part(old);
    if (!x || v === old) return;
    if (!v) { t.value = old; return; }
    var dup = part(v); if (dup && dup !== x) { msLater(v + " 품번은 이미 " + dup.n + "에 있습니다"); return; }
    x.p = v; saveMaster(); msLater(old + " → " + v + " 품번을 고쳤습니다");
    return;
  }
  if (t.hasAttribute("data-lname")) { LINES[t.getAttribute("data-lname")].name = t.value.trim(); setJSON(K_LINES, LINES); say("라인 이름을 저장했습니다"); return; }
  if (t.hasAttribute("data-litem")) {
    var g = LINE_GROUPS.filter(function (z) { return z.id === t.getAttribute("data-litem"); })[0], arr = (LINES[g.id].items || []).slice();
    while (arr.length < g.n) arr.push("");
    arr[+t.getAttribute("data-idx")] = t.value; LINES[g.id].items = arr; setJSON(K_LINES, LINES); say(g.label + " 품목을 저장했습니다");
  }
});
viewEl.addEventListener("submit", function (e) {
  if (e.target.id !== "ms-add") return;
  e.preventDefault();
  var p = document.getElementById("ms-add-p").value.trim(); if (!p || !msItem) return;
  var dup = part(p); if (dup) { say(p + " 품번은 이미 " + dup.n + "에 있습니다"); return; }
  M.parts.push({ m: msItem.split("|")[0], n: msItem.split("|")[1], p: p }); saveMaster();
  msLater(msItem.split("|")[1] + "에 " + p + " 품번을 추가했습니다");
  setTimeout(function () { var f = document.getElementById("ms-add-p"); if (f) f.focus(); }, 0);
});

document.getElementById("stamp").textContent = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" });
loadAll();
render();
</script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
// 공유 저장: 구글 로그인을 하면 기준정보 · 라인 구성 · 입고/출고 기록을 Firebase(Firestore)에 올려 팀이 같은 내용을 봅니다.
// 원본 대시보드와 같은 서버를 쓰지만 저장 이름이 "lot-"으로 시작해 서로 섞이지 않습니다.
// 화면 쪽 코드는 그대로 localStorage에 쓰고, 여기서 그 쓰기를 가로채 서버로 보내고 서버의 변경을 다시 localStorage와 화면에 반영합니다.
// 문서 하나 = 저장 키 하나 { v: JSON 문자열(지웠으면 null), t: 바꾼 시각(ms), by: 바꾼 사람 }. 늦게 쓴 쪽이 이깁니다.
(function () {
  var stateEl = document.getElementById("sync-state"), btn = document.getElementById("sync-btn");
  function say(t, s) { stateEl.textContent = t; stateEl.dataset.s = s || ""; }
  if (!window.firebase || !firebase.auth || !firebase.firestore) { say("공유 서버에 연결하지 못함 · 내 브라우저에만 저장", "err"); btn.hidden = true; return; }
  firebase.initializeApp({
    apiKey: "AIzaSyAzqVOB4qFyN4J2wBaFFt1wvLSPb-ahCbM",
    authDomain: "pml-dashboard-ff82d.firebaseapp.com",
    projectId: "pml-dashboard-ff82d",
    storageBucket: "pml-dashboard-ff82d.firebasestorage.app",
    messagingSenderId: "211055062030",
    appId: "1:211055062030:web:40edbca4b80f27fbaea05f"
  });
  var auth = firebase.auth(), col = firebase.firestore().collection("pml");
  var KEYS = ["lot-master", "lot-lines"];
  function isShared(k) { return KEYS.indexOf(k) >= 0 || /^lot-io-\d{4}-\d{2}$/.test(k); }   // 입고/출고 달별 키도 공유
  function sharedLocalKeys() { var out = KEYS.slice(); try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^lot-io-\d{4}-\d{2}$/.test(k)) out.push(k); } } catch (e) {} return out; }
  var META_KEY = "lot-sync-meta", MAX_BYTES = 950000;
  var rawSet = Storage.prototype.setItem, rawRemove = Storage.prototype.removeItem;
  var meta = {};   // 키별 { t: 내가 가진 판의 시각, d: 아직 서버에 못 올린 변경이 있으면 1 }
  try { meta = JSON.parse(localStorage.getItem(META_KEY) || "{}") || {}; } catch (e) { meta = {}; }
  function metaSave() { try { rawSet.call(localStorage, META_KEY, JSON.stringify(meta)); } catch (e) {} }
  function localGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var user = null, live = false, unsub = null, timers = {};

  function changed(k) {
    meta[k] = { t: Date.now(), d: 1 };
    metaSave();
    if (!live) return;
    clearTimeout(timers[k]);
    timers[k] = setTimeout(function () { push(k); }, 400);
  }
  Storage.prototype.setItem = function (k, v) {
    var shared = this === localStorage && isShared(k), same = shared && this.getItem(k) === String(v);
    rawSet.call(this, k, v);
    if (shared && !same) changed(k);
  };
  Storage.prototype.removeItem = function (k) {
    var shared = this === localStorage && isShared(k), had = shared && this.getItem(k) !== null;
    rawRemove.call(this, k);
    if (had) changed(k);
  };

  function okText() { return "팀과 공유 중 · " + user.email; }
  function push(k) {
    if (!live || !user) return;
    var v = localGet(k), m = meta[k] || (meta[k] = { t: Date.now(), d: 1 });
    if (v !== null && new Blob([v]).size > MAX_BYTES) { say("데이터가 너무 커서 공유하지 못함 (" + k + ") · 내 브라우저에만 저장", "err"); return; }
    var t = m.t;
    say("올리는 중…", "ok");
    col.doc(k).set({ v: v, t: t, by: user.email }).then(function () {
      if (meta[k] && meta[k].t === t) { meta[k].d = 0; metaSave(); }
      if (live) say(okText(), "ok");
    }).catch(function (e) {
      say(e && e.code === "permission-denied" ? "공유 권한이 없는 계정: " + user.email : "서버에 올리지 못함 · 내 브라우저에는 저장됨", "err");
    });
  }

  // 서버에서 받은 내용을 화면 쪽 변수에 다시 싣고 지금 보던 화면을 다시 그립니다.
  function refresh(keys) {
    try { loadAll(); render(); } catch (e) { location.reload(); }
  }

  function onSnap(snap, first) {
    var applied = [], seen = {};
    snap.docChanges().forEach(function (ch) {
      var k = ch.doc.id;
      if (!isShared(k) || ch.type === "removed") return;
      seen[k] = 1;
      if (ch.doc.metadata.hasPendingWrites) return;
      var data = ch.doc.data(), rv = typeof data.v === "string" ? data.v : null, rt = Number(data.t) || 0;
      var m = meta[k] || { t: 0, d: 0 };
      if (rv === localGet(k)) { if (!m.d || m.t <= rt) meta[k] = { t: rt, d: 0 }; return; }
      if (m.d && m.t > rt) { push(k); return; }   // 내 쪽이 더 새 변경
      try { if (rv === null) rawRemove.call(localStorage, k); else rawSet.call(localStorage, k, rv); } catch (e) { return; }
      meta[k] = { t: rt, d: 0 };
      applied.push(k);
    });
    if (first) sharedLocalKeys().forEach(function (k) { if (!seen[k] && localGet(k) !== null) push(k); });   // 서버에 아직 없는 데이터는 내 것을 올립니다
    metaSave();
    if (applied.length) refresh(applied);
  }

  auth.onAuthStateChanged(function (u) {
    if (unsub) { unsub(); unsub = null; }
    user = u; live = false;
    if (!u) { btn.textContent = "로그인"; btn.title = ""; say("내 브라우저에만 저장 중"); return; }
    btn.textContent = "로그아웃"; btn.title = u.email;
    say("연결 중…");
    var first = true;
    unsub = col.onSnapshot(function (snap) {
      live = true;
      say(okText(), "ok");
      onSnap(snap, first);
      first = false;
    }, function (e) {
      live = false;
      say(e && e.code === "permission-denied" ? "공유 권한이 없는 계정: " + u.email + " · 내 브라우저에만 저장" : "공유 서버 연결 오류 · 내 브라우저에만 저장", "err");
    });
  });
  btn.addEventListener("click", function () {
    if (user) { auth.signOut(); return; }
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function (e) {
      if (e && (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request")) return;
      say("로그인하지 못함" + (e && e.code ? " (" + e.code + ")" : ""), "err");
    });
  });
})();
</script>
<script>
// 자동 업데이트: 열어 둔 화면도 GitHub에 새 버전이 올라오면 저절로 새로고침합니다.
// 1분마다(그리고 탭으로 돌아올 때) 이 페이지 파일을 다시 받아 처음 받은 것과 비교합니다. 데이터는 브라우저 · 공유 서버에 저장돼 있어 새로고침해도 그대로입니다.
// 입력 칸을 쓰는 중이면 끝날 때까지 기다렸다가 새로고침합니다.
(function () {
  if (!/^https?:/.test(location.protocol) || !window.fetch) return;
  var base = null, pending = false, EVERY = 60000;
  function hash(t) { var h = 0; for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return h; }
  function busy() { var a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT") && a.type !== "checkbox" && a.type !== "file"; }
  function tryReload() {
    if (busy()) { setTimeout(tryReload, 3000); return; }
    var n = document.getElementById("upd-note");
    if (n) n.hidden = false;
    setTimeout(function () { location.reload(); }, 1200);
  }
  function check() {
    if (pending || document.hidden) return;
    fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : null; }).then(function (t) {
      if (!t) return;
      var h = hash(t);
      if (base === null) { base = h; return; }
      if (h !== base) { pending = true; tryReload(); }
    }).catch(function () {});
  }
  check();
  setInterval(check, EVERY);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
})();
</script>
<div id="upd-note" class="upd-note" role="status" hidden>새 버전이 올라와 화면을 새로고침합니다…</div>
