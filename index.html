<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생산관리·물류 대시보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with a two-group tab rail (생산관리 ×3 | 물류 ×1); one section panel visible at a time, each a grid of empty slots. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --line: #d5dbd8;
  --fg: #17211e;
  --muted: #5f6d68;
  --accent: #0f6e5c;
  --accent-soft: #dcefe9;
  --slot: #f8faf9;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101514; --surface: #171e1c; --line: #2b3633; --fg: #e6ecea; --muted: #94a39e;
    --accent: #4fc2a8; --accent-soft: #1a332d; --slot: #131a18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101514; --surface: #171e1c; --line: #2b3633; --fg: #e6ecea; --muted: #94a39e;
  --accent: #4fc2a8; --accent-soft: #1a332d; --slot: #131a18; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-block: 16px 10px; }
.brand h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.brand .stamp { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

nav.rail { display: flex; gap: 28px; overflow-x: auto; scrollbar-width: none; }
nav.rail::-webkit-scrollbar { display: none; }
.group { display: flex; flex-direction: column; gap: 4px; flex: none; }
.group-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.tabs { display: flex; gap: 4px; }
.tab { appearance: none; border: 0; background: none; font: inherit; font-weight: 500; color: var(--muted); padding: 9px 12px 11px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.group + .group { border-left: 1px solid var(--line); padding-left: 28px; }

main { padding-block: 28px 56px; display: flex; flex-direction: column; gap: 22px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
.crumb { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--accent); }
.sec-head h2 { margin: 2px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.sec-head p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.slot { grid-column: span 4; min-width: 0; min-height: 132px; background: var(--slot); border: 1.5px dashed var(--line); border-radius: 6px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.slot.wide { grid-column: span 8; min-height: 280px; }
.slot.tall { min-height: 280px; }
.slot.full { grid-column: 1 / -1; min-height: 220px; }
.slot h3 { margin: 0; font-size: 15px; font-weight: 600; }
.slot p { margin: 0; font-size: 13px; color: var(--muted); }
.slot .tag { margin-top: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
@media (max-width: 860px) {
  .slot, .slot.wide { grid-column: span 6; }
  .slot.wide { grid-column: 1 / -1; }
}
@media (max-width: 560px) {
  .slot, .slot.wide, .slot.full { grid-column: 1 / -1; min-height: 110px; }
  .sec-head h2 { font-size: 22px; }
  nav.rail, .group + .group { gap: 16px; padding-left: 16px; }
  nav.rail { padding-left: 0; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>생산관리·물류 대시보드</h1>
      <span class="stamp" id="stamp"></span>
    </div>
    <nav class="rail" aria-label="섹션">
      <div class="group">
        <span class="group-label">생산관리</span>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-machining" data-sec="machining">가공계획수립</button>
          <button class="tab" role="tab" id="tab-assembly" data-sec="assembly">조립계획수립</button>
          <button class="tab" role="tab" id="tab-shipping" data-sec="shipping">출고계획수립</button>
        </div>
      </div>
      <div class="group">
        <span class="group-label">물류</span>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-warehouse" data-sec="warehouse">물류창고</button>
        </div>
      </div>
    </nav>
  </div>
</header>

<div class="wrap">
<main>
  <section id="sec-machining" role="tabpanel" aria-labelledby="tab-machining">
    <div class="sec-head">
      <div>
        <div class="crumb">생산관리 / 01</div>
        <h2>가공계획수립</h2>
        <p>가공 공정의 생산 계획을 세우고 진행 상황을 확인하는 화면입니다.</p>
      </div>
      <span class="badge">내용 준비 중</span>
    </div>
  </section>

  <section id="sec-assembly" role="tabpanel" aria-labelledby="tab-assembly" hidden>
    <div class="sec-head">
      <div>
        <div class="crumb">생산관리 / 02</div>
        <h2>조립계획수립</h2>
        <p>조립 라인의 생산 계획을 세우고 진행 상황을 확인하는 화면입니다.</p>
      </div>
      <span class="badge">내용 준비 중</span>
    </div>
  </section>

  <section id="sec-shipping" role="tabpanel" aria-labelledby="tab-shipping" hidden>
    <div class="sec-head">
      <div>
        <div class="crumb">생산관리 / 03</div>
        <h2>출고계획수립</h2>
        <p>완성품 출고 일정을 세우고 납기 대응 현황을 확인하는 화면입니다.</p>
      </div>
      <span class="badge">내용 준비 중</span>
    </div>
  </section>

  <section id="sec-warehouse" role="tabpanel" aria-labelledby="tab-warehouse" hidden>
    <div class="sec-head">
      <div>
        <div class="crumb">물류 / 04</div>
        <h2>물류창고</h2>
        <p>창고의 재고와 입출고 흐름을 확인하는 화면입니다.</p>
      </div>
      <span class="badge">내용 준비 중</span>
    </div>
  </section>

  <div class="grid" id="grid"></div>
</main>
</div>

<script>
// 섹션별 빈 자리. 실제 내용이 정해지면 이 자리를 채웁니다.
var SLOTS = {
  machining: [
    ["요약 지표", "계획 대비 실적 같은 핵심 숫자가 들어갈 자리", ""],
    ["요약 지표", "설비 가동, 부하율 등", ""],
    ["요약 지표", "지연·이슈 건수 등", ""],
    ["가공 계획표", "설비·품번·일자별 계획이 들어갈 자리", "wide"],
    ["설비별 현황", "설비 부하나 상태 목록", "tall"],
    ["상세 목록", "작업지시 단위의 표가 들어갈 자리", "full"]
  ],
  assembly: [
    ["요약 지표", "계획 대비 실적 같은 핵심 숫자가 들어갈 자리", ""],
    ["요약 지표", "라인 가동, 인원 등", ""],
    ["요약 지표", "자재 결품·이슈 건수 등", ""],
    ["조립 계획표", "라인·모델·일자별 계획이 들어갈 자리", "wide"],
    ["라인별 현황", "라인 부하나 상태 목록", "tall"],
    ["상세 목록", "작업지시 단위의 표가 들어갈 자리", "full"]
  ],
  shipping: [
    ["요약 지표", "오늘 출고 예정·완료 같은 핵심 숫자가 들어갈 자리", ""],
    ["요약 지표", "납기 준수율 등", ""],
    ["요약 지표", "지연·보류 건수 등", ""],
    ["출고 일정표", "고객사·품번·일자별 출고 계획이 들어갈 자리", "wide"],
    ["고객사별 현황", "납기 대응 상태 목록", "tall"],
    ["상세 목록", "출고 건 단위의 표가 들어갈 자리", "full"]
  ],
  warehouse: [
    ["요약 지표", "총 재고, 적치율 같은 핵심 숫자가 들어갈 자리", ""],
    ["요약 지표", "오늘 입고·출고 건수 등", ""],
    ["요약 지표", "부족·과잉 품목 수 등", ""],
    ["재고 현황", "품목·위치별 재고가 들어갈 자리", "wide"],
    ["입출고 흐름", "최근 입고·출고 내역", "tall"],
    ["상세 목록", "품목 단위의 재고 표가 들어갈 자리", "full"]
  ]
};
var ORDER = ["machining", "assembly", "shipping", "warehouse"];
var tabs = document.querySelectorAll(".tab");
var grid = document.getElementById("grid");

function show(sec) {
  if (ORDER.indexOf(sec) < 0) sec = ORDER[0];
  ORDER.forEach(function (s) { document.getElementById("sec-" + s).hidden = s !== sec; });
  tabs.forEach(function (t) {
    var on = t.dataset.sec === sec;
    t.setAttribute("aria-selected", on ? "true" : "false");
    t.tabIndex = on ? 0 : -1;
    if (on && t.scrollIntoView) t.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
  grid.innerHTML = "";
  SLOTS[sec].forEach(function (s) {
    var d = document.createElement("div");
    d.className = "slot" + (s[2] ? " " + s[2] : "");
    var h = document.createElement("h3"); h.textContent = s[0];
    var p = document.createElement("p"); p.textContent = s[1];
    var t = document.createElement("span"); t.className = "tag"; t.textContent = "비어 있음";
    d.append(h, p, t);
    grid.appendChild(d);
  });
  try { localStorage.setItem("pl-sec", sec); } catch (e) {}
}

tabs.forEach(function (t, i) {
  t.addEventListener("click", function () {
    show(t.dataset.sec);
    try { history.replaceState(null, "", "#" + t.dataset.sec); } catch (e) {}
  });
  t.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var n = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
    n.focus(); n.click();
  });
});

var start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem("pl-sec") || ""; } catch (e) {} }
show(start);

document.getElementById("stamp").textContent =
  new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" });
</script>
</body>
</html>
